<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horizonte News</title>
<link rel="preconnect" href="https://play.google.com" />
<style>
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #000000;
    color: #FFFFFF;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .logo {
    width: 88px;
    height: 88px;
    border-radius: 20px;
    margin-bottom: 24px;
    box-shadow: 0 0 24px 4px rgba(255, 107, 0, 0.35);
  }
  h1 {
    font-size: 20px;
    margin-bottom: 8px;
    color: #FFFFFF;
  }
  p {
    color: #AAAAAA;
    font-size: 14px;
    margin-bottom: 24px;
  }
  a.button {
    display: inline-block;
    background: linear-gradient(90deg, #FF6B00, #FF8C3A);
    color: #FFFFFF;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 16px;
    box-shadow: 0 4px 16px rgba(255, 107, 0, 0.35);
  }
  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid #222222;
    border-top-color: #FF6B00;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
