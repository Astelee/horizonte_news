<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Horizonte News</title>
<style>
  body {
    margin: 0;
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  h1 { font-size: 20px; margin-bottom: 8px; }
  p { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
  a.button {
    display: inline-block;
    background: #2563eb;
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 16px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid #334155;
    border-top-color: #2563eb;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 20px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Abrindo no Horizonte News…</h1>
  <p id="subtitle">Se o app não abrir automaticamente, baixe-o abaixo.</p>
  <a class="button" id="storeLink" href="#">Baixar na Play Store</a>

  <script>
    // Extrai o postId a partir de /noticia/{postId}
    var parts = window.location.pathname.split('/').filter(Boolean);
    var postId = parts.length > 1 ? parts[1] : '';

    var PACKAGE_NAME = 'com.astelee.horizonte_news';

    // Link da Play Store levando o postId como referrer, para o app
    // conseguir ler via Play Install Referrer API na primeira abertura
    // (fluxo tratado em DeepLinkService._checkInstallReferrer).
    var referrer = postId ? '&referrer=' + encodeURIComponent('postId=' + postId) : '';
    var playStoreUrl =
      'https://play.google.com/store/apps/details?id=' + PACKAGE_NAME + referrer;

    document.getElementById('storeLink').href = playStoreUrl;

    // Se chegou até aqui, é porque o Android NÃO abriu o app direto via
    // App Link verificado (ou o usuário está em outra plataforma/navegador
    // que não suporta isso). Nesse caso, esta página só existe pra levar
    // pra Play Store — sem site "no meio do caminho" para o usuário.
    //
    // Pequeno atraso apenas para não competir com um possível App Link
    // ainda em processamento; depois disso, redireciona sozinho.
    setTimeout(function () {
      window.location.replace(playStoreUrl);
    }, 800);
  </script>
</body>
</html>
