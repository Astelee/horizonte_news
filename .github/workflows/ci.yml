name: Verificações automáticas (CI)

# Roda a cada push na main, em pull requests e sob demanda. Nenhuma etapa
# publica nada: regras do Firestore e backend são publicados manualmente
# (ver cloudflare/horizonte-worker/README.md e GUIA_DA_IA.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter — análise e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Só erros reprovam por enquanto (avisos e dicas aparecem no log).
      # Quando o projeto estiver limpo, remova as duas flags.
      - name: Análise estática
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Testes do app
        run: flutter test

  firestore-rules:
    name: Regras do Firestore (emulador)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências dos testes
        working-directory: tests/firestore_rules
        run: npm install --no-audit --no-fund

      - name: Testar regras (usuário comum x administrador)
        working-directory: tests/firestore_rules
        run: npm test

  backend:
    name: Backend (Cloudflare Worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Testes do backend
        working-directory: cloudflare/horizonte-worker
        run: npm test