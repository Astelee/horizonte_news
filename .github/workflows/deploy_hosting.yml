name: Publicar site no Firebase Hosting

on:
  push:
    branches:
      - main
    paths:
      - 'public/**'
      - 'firebase.json'
      - '.github/workflows/deploy_hosting.yml'
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

env:
  CUSTOM_DOMAIN: horizontenews.app.br

jobs:
  deploy_hosting:
    name: Publicar site no Firebase Hosting
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Validar JSONs
        run: |
          python3 -m json.tool firebase.json > /dev/null
          python3 -m json.tool public/.well-known/assetlinks.json > /dev/null

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: horizontenews-6b48f
          channelId: live

      - name: Verificar assetlinks.json no domínio oficial
        run: |
          sleep 20
          r=$(curl -sS -o /tmp/al.json -w '%{http_code} %{content_type}' "https://$CUSTOM_DOMAIN/.well-known/assetlinks.json")
          echo "Resposta: $r"
          [[ "$r" == "200 application/json"* ]] || { echo "::error::assetlinks.json inválido em $CUSTOM_DOMAIN"; exit 1; }
          grep -q com.astelee.horizonte_news /tmp/al.json