name: Compilar Flutter (APK e AAB)

on:
  workflow_dispatch:
    inputs:
      tipo_build:
        description: 'O que compilar?'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - ambos

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Configurar Ambiente e Gerar Builds
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'
          cache: true

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/horizonte-key.jks

      - name: Mostrar SHA-256 do Keystore
        run: |
          keytool -list -v \
            -keystore android/horizonte-key.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            | grep "SHA256:"

      - name: Criar key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../horizonte-key.jks" >> android/key.properties

      - name: Instalar Dependências
        run: flutter pub get

      - name: Rodar Testes Automatizados
        run: flutter test

      - name: Gerar Ícones
        run: flutter pub run flutter_launcher_icons

      # BACKEND_URL (Settings → Secrets and variables → Actions → aba
      # "Variables"): quando existe, o app fala com o backend seguro
      # (Cloudflare Worker) e a chave REST do OneSignal NÃO entra no app.
      # Enquanto não existir, o build segue no modo antigo (a chave vai
      # dentro do app). Ver cloudflare/horizonte-worker/README.md.
      - name: Definir dart-defines
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            echo "Backend seguro ativo: a chave REST do OneSignal NÃO entra no app."
            echo "DEFINES=--dart-define=BACKEND_URL=$BACKEND_URL" >> "$GITHUB_ENV"
          else
            echo "::warning::BACKEND_URL não configurada: build no modo antigo (chave REST do OneSignal dentro do app)."
            echo "::add-mask::$ONESIGNAL_REST_API_KEY"
            echo "DEFINES=--dart-define=ONESIGNAL_REST_API_KEY=$ONESIGNAL_REST_API_KEY" >> "$GITHUB_ENV"
          fi

      # ── APK ──────────────────────────────────────────────────
      # --target-platform android-arm64: só a arquitetura usada por
      # praticamente todo celular atual (build bem mais rápido).
      - name: Compilar APK Release
        if: ${{ inputs.tipo_build == 'apk' || inputs.tipo_build == 'ambos' }}
        run: |
          flutter build apk --release --target-platform android-arm64 $DEFINES
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/Horizonte-News-${{ github.run_number }}.apk

      - name: Disponibilizar APK para Download
        if: ${{ inputs.tipo_build == 'apk' || inputs.tipo_build == 'ambos' }}
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-APK-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/Horizonte-News-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 7

      # ── AAB ──────────────────────────────────────────────────
      - name: Compilar AAB Release
        if: ${{ inputs.tipo_build == 'aab' || inputs.tipo_build == 'ambos' }}
        run: |
          flutter build appbundle --release $DEFINES
          mv build/app/outputs/bundle/release/app-release.aab \
             build/app/outputs/bundle/release/Horizonte-News-${{ github.run_number }}.aab

      - name: Disponibilizar AAB para Download
        if: ${{ inputs.tipo_build == 'aab' || inputs.tipo_build == 'ambos' }}
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-AAB-${{ github.run_number }}
          path: build/app/outputs/bundle/release/Horizonte-News-${{ github.run_number }}.aab
          if-no-files-found: error
          retention-days: 7

      - name: Limpar keystore
        if: always()
        run: rm -f android/horizonte-key.jks android/key.properties