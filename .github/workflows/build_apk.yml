name: Compilar Flutter (APK e AAB)

on:
  workflow_dispatch:
    inputs:
      tipo_build:
        description: 'O que compilar?'
        required: true
        default: 'apk'
        type: choice
        options:
          - apk
          - aab
          - ambos

jobs:
  build:
    name: Configurar Ambiente e Gerar Builds
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.x'
          channel: 'stable'
          cache: true

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/horizonte-key.jks

      - name: Criar key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../horizonte-key.jks" >> android/key.properties

      - name: Instalar Dependências
        run: flutter pub get

      - name: Rodar Testes Automatizados
        run: flutter test

      - name: Gerar Ícones
        run: flutter pub run flutter_launcher_icons

      # ── APK ──────────────────────────────────────────────────
      # --target-platform android-arm64: gera só a arquitetura usada
      # por praticamente todo celular atual, em vez das 3 padrão
      # (arm, arm64, x64) — corta bastante o tempo desse passo.
      - name: Compilar APK Release
        if: ${{ inputs.tipo_build == 'apk' || inputs.tipo_build == 'ambos' }}
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --dart-define=ONESIGNAL_REST_API_KEY=${{ secrets.ONESIGNAL_REST_API_KEY }}

      - name: Renomear APK
        if: ${{ inputs.tipo_build == 'apk' || inputs.tipo_build == 'ambos' }}
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Horizonte-News.apk

      - name: Disponibilizar APK para Download
        if: ${{ inputs.tipo_build == 'apk' || inputs.tipo_build == 'ambos' }}
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-APK
          path: build/app/outputs/flutter-apk/Horizonte-News.apk
          retention-days: 7

      # ── AAB ──────────────────────────────────────────────────
      - name: Compilar AAB Release
        if: ${{ inputs.tipo_build == 'aab' || inputs.tipo_build == 'ambos' }}
        run: |
          flutter build appbundle --release \
            --dart-define=ONESIGNAL_REST_API_KEY=${{ secrets.ONESIGNAL_REST_API_KEY }}

      - name: Renomear AAB
        if: ${{ inputs.tipo_build == 'aab' || inputs.tipo_build == 'ambos' }}
        run: mv build/app/outputs/bundle/release/app-release.aab build/app/outputs/bundle/release/Horizonte-News.aab

      - name: Disponibilizar AAB para Download
        if: ${{ inputs.tipo_build == 'aab' || inputs.tipo_build == 'ambos' }}
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-AAB
          path: build/app/outputs/bundle/release/Horizonte-News.aab
          retention-days: 7