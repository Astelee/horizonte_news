name: Compilar Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Configurar Ambiente e Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # Adicionamos a limpeza aqui para evitar arquivos acumulados
      - name: Limpeza e Dependências
        run: |
          flutter clean
          flutter pub get

      # Gerando split-per-abi para reduzir o tamanho dos APKs individuais
      - name: Compilar APK em Modo Debug
        run: flutter build apk --debug --split-per-abi

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-APKs
          # Isso enviará todos os APKs gerados, escolha o 'arm64-v8a' para celulares modernos
          path: build/app/outputs/flutter-apk/*.apk