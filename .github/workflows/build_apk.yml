name: Compilar Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Configurar Ambiente e Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Decodificar Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/horizonte-key.jks

      - name: Criar key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=../horizonte-key.jks" >> android/key.properties

      - name: Limpeza, Dependências e Ícones
        run: |
          flutter clean
          flutter pub get
          dart pub global activate flutter_launcher_icons
          dart run flutter_launcher_icons

      - name: Compilar APK Release
        run: flutter build apk --release --split-per-abi

      - name: Renomear APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in *-release.apk; do
            ARCH=$(echo "$f" | sed 's/app-\(.*\)-release\.apk/\1/')
            mv "$f" "Horizonte-News-${ARCH}.apk"
          done

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-APKs
          path: build/app/outputs/flutter-apk/Horizonte-News-*.apk
          retention-days: 7