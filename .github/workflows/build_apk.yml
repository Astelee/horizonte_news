name: Compilar Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Configurar Ambiente e Gerar APK
    runs-on: ubuntu-latest

    steps:
      # 1. Faz o download do código do repositório para o servidor do GitHub
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      # 2. Instala o Java Corretamente (Utilizando a action oficial do GitHub)
      - name: Configurar Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Instala e configura o ecossistema do Flutter
      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # 4. Baixa todas as dependências do pubspec.yaml
      - name: Instalar Dependências do Projeto
        run: flutter pub get

      # 5. Executa a compilação oficial em modo release
      - name: Compilar APK em Modo Release
        run: flutter build apk --release

      # 6. Disponibiliza o APK para download
      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: horizonte-news-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
