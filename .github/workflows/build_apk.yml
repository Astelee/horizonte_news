name: Compilar Flutter APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Configurar Ambiente e Gerar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar Código do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Limpeza, Dependências e Ícones
        run: |
          flutter clean
          flutter pub get
          # Instala o gerador de ícones e aplica sua imagem (assets/images/icon_app.png)
          dart pub global activate flutter_launcher_icons
          dart run flutter_launcher_icons
          
      - name: Compilar APK em Modo Debug
        run: flutter build apk --debug --split-per-abi

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Horizonte-News-APKs
          # Filtramos apenas os APKs para evitar o envio de logs pesados e desnecessários
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 1