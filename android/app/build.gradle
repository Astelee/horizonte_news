plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Lê o arquivo key.properties gerado pelo workflow
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.astelee.horizonte_news"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    defaultConfig {
        applicationId "com.astelee.horizonte_news"
        // 1. ALTERADO: Reduzido para 21 para suportar Android 5.0+
        minSdkVersion 21 
        targetSdkVersion flutter.targetSdkVersion
        versionCode 1
        versionName "1.0"
        
        // 2. ADICIONADO: Ativa o suporte para dividir bibliotecas grandes em aparelhos antigos
        multiDexEnabled true 
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

// 3. ADICIONADO: Dependência oficial do MultiDex para o Android 5.0 e 6.0
dependencies {
    implementation "androidx.multidex:multidex:2.0.1"
}

// Plugin aplicado no final — compatível com o sistema de Gradle do projeto
apply plugin: 'com.google.gms.google-services'