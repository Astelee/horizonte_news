name: horizonte_news
description: Aplicativo de notícias profissional para o portal Horizonte News.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gerenciamento de Estado
  provider: ^6.1.2

  # UI e Widgets
  google_nav_bar: ^5.0.6
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2
  font_awesome_flutter: ^10.6.0

  # Rede e Imagem
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # Funcionalidades
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.2
  intl: ^0.18.1
  record: ^5.1.2

  # Armazenamento seguro
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_messaging: ^15.0.1
  firebase_analytics: ^11.1.1
  cloud_firestore: ^5.1.0
  firebase_database: ^11.1.0
  firebase_storage: ^12.2.0

  # Notificações locais (foreground)
  flutter_local_notifications: ^17.0.0

  # Som ambiente
  audioplayers: ^6.1.0

  # WebView para vídeos YouTube
  webview_flutter: ^4.7.0

dependency_overrides:
  font_awesome_flutter: 10.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon_app.png"
  min_sdk_android: 21
