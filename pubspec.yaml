name: horizonte_news
description: "Horizonte News - Portal de notícias regional"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Gerenciamento de Estado
  provider: ^6.1.2

  # UI e Widgets
  flutter_html: ^3.0.0-beta.2
  font_awesome_flutter: ^10.6.0

  # Rede e Imagem
  http: ^1.2.1
  cached_network_image: ^3.3.1

  # Funcionalidades
  url_launcher: ^6.3.0
  share_plus: ^9.0.0
  shared_preferences: ^2.2.3
  intl: ^0.19.0

  # Armazenamento seguro
  flutter_secure_storage: ^9.0.0

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  firebase_analytics: ^11.1.1
  cloud_firestore: ^5.1.0

  # Seleção de imagem/vídeo para o editor de notícias (upload Cloudinary)
  image_picker: ^1.1.2

  # OneSignal — sistema único de notificações
  onesignal_flutter: ^5.2.4

  # Som ambiente
  audioplayers: ^6.1.0

  # Player de vídeo (matérias com vídeo, ex.: Cloudinary)
  video_player: ^2.9.2

  # Anúncios — Google AdMob
  google_mobile_ads: ^5.1.0

dependency_overrides:
  font_awesome_flutter: 10.6.0
  intl: 0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/ads/parceiros/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/images/icon_app.png"
  min_sdk_android: 21